name: server status

# Run by hand (Actions > server status > Run workflow) to see what the server
# looks like without an SSH session: containers, nginx, certificates, firewall
# and which domain the backend thinks it is on. Read-only, and it prints no
# secrets: only the URL lines of .env.prod.
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: inspect over ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/pub-quiz-v3
            echo "== server"; hostname; curl -s --max-time 5 https://api.ipify.org; echo
            echo "== deployed commit"; git log --oneline -1
            echo "== containers"; docker compose -f docker-compose.prod.yml ps --format '{{.Name}}  {{.Status}}'
            echo "== backend urls"; grep -E '^(APP_NAME|APP_URL|FRONTEND_URL|CORS_ALLOWED_ORIGINS|SESSION_DOMAIN|SANCTUM_STATEFUL_DOMAINS)=' pub-quiz-api/.env.prod || echo "no .env.prod url lines"
            echo "== sudo"; sudo -n true 2>/dev/null && echo "passwordless sudo: yes" || echo "passwordless sudo: no"
            echo "== nginx sites"; ls -la /etc/nginx/sites-enabled/ 2>&1
            echo "== nginx test"; sudo -n nginx -t 2>&1 || true
            echo "== certificates"; sudo -n ls /etc/letsencrypt/live/ 2>&1 || true
            sudo -n certbot certificates 2>&1 | grep -E 'Certificate Name|Domains|Expiry' || true
            echo "== firewall"; sudo -n ufw status 2>&1 | head -20 || true
            echo "== local responses"
            curl -s -o /dev/null -w 'frontend :5173 -> %{http_code}\n' http://127.0.0.1:5173/ || true
            curl -s -o /dev/null -w 'backend  :8080 -> %{http_code}\n' http://127.0.0.1:8080/api/organizations || true
            curl -s -o /dev/null -w 'nginx :80 Host koznagde.rs -> %{http_code}\n' -H 'Host: koznagde.rs' http://127.0.0.1/ || true
            curl -sk -o /dev/null -w 'nginx :443 koznagde.rs -> %{http_code}\n' --resolve koznagde.rs:443:127.0.0.1 https://koznagde.rs/ || true
