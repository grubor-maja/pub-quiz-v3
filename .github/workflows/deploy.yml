name: deploy to production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploy via ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Host lives in a secret so moving the site to another server is a
          # settings change, not a commit.
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/pub-quiz-v3
            git pull origin master
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force
            # Each rebuild leaves the previous image behind. Left alone these
            # fill a small droplet's disk within a few dozen deploys, which
            # takes the whole box down, so clear them out every time.
            docker image prune -af
            docker builder prune -af --filter until=168h
