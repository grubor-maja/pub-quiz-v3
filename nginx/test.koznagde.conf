# Test okruzenje - https://test.koznagde.rs
#
# Na serveru: /etc/nginx/conf.d/test.koznagde.rs.conf (pored koznagde.rs.conf).
# Samo port 80, isto kao produkcija: HTTPS radi Cloudflare (Proxied, narandzast
# oblacic), a do servera stize obican HTTP. Bez certbota - redirect 80->443 na
# serveru bi sa Cloudflare "Flexible" SSL-om napravio beskonacnu petlju.
#
# Backend (staging) -> 127.0.0.1:8081
# Frontend (staging) -> 127.0.0.1:5174

server {
    listen 80;
    server_name test.koznagde.rs;

    # Test sajt ne sme u Google: bio bi duplikat produkcije, a i podaci su
    # izmisljeni. Header vazi za svaki odgovor, ukljucujuci API i slike.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Opciono: lozinka za ceo test sajt, da ga vide samo ti i klijent.
    #   sudo dnf install -y httpd-tools   (ili: sudo apt install apache2-utils)
    #   sudo htpasswd -c /etc/nginx/.htpasswd-test klijent
    # pa otkomentarisati ove dve linije:
    # auth_basic "Test";
    # auth_basic_user_file /etc/nginx/.htpasswd-test;

    location /storage/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
