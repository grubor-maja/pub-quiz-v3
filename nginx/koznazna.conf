# Referentni fajl - ovaj config je vec podeseno na serveru u /etc/nginx/sites-enabled/koznazna.me
# Ne editovati direktno ovde - editovati na serveru ako je potrebno.
#
# Backend (Laravel) -> localhost:8080 (Docker container)
# Frontend (React)  -> localhost:5173 (Docker container)
# Slike i drugi javni fajlovi iz Laravel storage:link -> /storage/*
#
# Frontend kontejner sam prosledjuje rute aplikacije backendu (videti
# docker/frontend/nginx.conf), pa ovde ne treba nista dodavati za SEO
# meta tagove - dovoljno je da "location /" i dalje ide na 5173.

# www -> apex. Bez ovoga isti sadrzaj postoji na dva hostname-a; canonical tag
# to ublazava, ali redirect je jednoznacan signal i ne trosi crawl budget na
# duplikate.
server {
    listen 443 ssl;
    server_name www.koznazna.me;

    ssl_certificate /etc/letsencrypt/live/koznazna.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koznazna.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://koznazna.me$request_uri;
}

server {
    server_name koznazna.me;

    # Storage files (uploaded quiz images itd.) - proxy na backend
    location /storage/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Crawleri ih traze u korenu domena, a generise ih Laravel iz baze.
    location = /sitemap.xml {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/koznazna.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koznazna.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.koznazna.me) {
        return 301 https://koznazna.me$request_uri;
    }
    if ($host = koznazna.me) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name koznazna.me www.koznazna.me;
    return 404;
}
