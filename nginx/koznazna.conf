# Referentni fajl - ovaj config je vec podeseno na serveru u /etc/nginx/sites-enabled/koznazna.me
# Ne editovati direktno ovde - editovati na serveru ako je potrebno.
#
# Backend (Laravel) -> localhost:8080 (Docker container)
# Frontend (React)  -> localhost:5173 (Docker container)

server {
    server_name koznazna.me www.koznazna.me;

    location /api {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/koznazna.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koznazna.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.koznazna.me) {
        return 301 https://$host$request_uri;
    }
    if ($host = koznazna.me) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name koznazna.me www.koznazna.me;
    return 404;
}
