    <!-- Tells Google the site name to show above the result, and offers the
         search box some listings get. Static here so it is present in the
         served HTML rather than waiting on JavaScript. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Ko Zna Gde",
      "alternateName": ["Ko zna gde", "Pab kvizovi u Srbiji"],
      "url": "https://koznagde.rs/",
      "inLanguage": "sr-RS",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://koznagde.rs/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
