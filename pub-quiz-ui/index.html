<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Ko Zna Zna | Pab kvizovi u Srbiji</title>
    <meta name="description" content="Agregator pab kvizova u Srbiji. Svi predstojeci kvizovi na jednom mestu: datum, vreme, lokacija, kotizacija i organizator, sa mapom i pretragom." />
    <link rel="canonical" href="https://koznazna.me/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B0B10" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ko Zna Zna" />
    <meta property="og:locale" content="sr_RS" />
    <meta property="og:title" content="Ko Zna Zna | Pab kvizovi u Srbiji" />
    <meta property="og:description" content="Agregator pab kvizova u Srbiji. Svi predstojeci kvizovi na jednom mestu, sa mapom i pretragom." />
    <meta property="og:url" content="https://koznazna.me/" />
    <meta property="og:image" content="https://koznazna.me/images/logo1.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tells Google the site name to show above the result, and offers the
         search box some listings get. Static here so it is present in the
         served HTML rather than waiting on JavaScript. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Ko Zna Zna",
      "alternateName": "Agregator pab kvizova u Srbiji",
      "url": "https://koznazna.me/",
      "inLanguage": "sr-RS",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://koznazna.me/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Road+Rage&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
