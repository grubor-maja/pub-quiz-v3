services:
  mysql:
    image: mysql:8.0
    container_name: pubquiz-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pubquiz
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_USER: pubquiz
      MYSQL_PASSWORD: pubquiz_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: pubquiz-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./pub-quiz-api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    container_name: pubquiz-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./pub-quiz-ui:/app
      - frontend_modules:/app/node_modules

volumes:
  mysql_data:
  frontend_modules:
