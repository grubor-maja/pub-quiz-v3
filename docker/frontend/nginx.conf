server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these, so a name never refers to different bytes.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A real file wins; everything else is an application route and goes to
    # Laravel, which returns this same index.html with the title, description,
    # canonical, og: tags and structured data written for that URL. The SPA
    # cannot do that itself: its markup is an empty <div id="root">, so a
    # crawler that does not run JavaScript - and every link preview in
    # WhatsApp, Viber and Messenger, which never do - used to see the home
    # page whichever quiz it asked for.
    location / {
        try_files $uri @app;
    }

    location @app {
        # Docker's embedded DNS, with the upstream held in a variable so the
        # name is resolved per request rather than at startup. With a literal
        # host nginx refuses to start when the backend container is not up
        # yet, which on a fresh deploy is most of the time - and it does not
        # retry, so the frontend would stay down after the backend recovered.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend backend;
        proxy_pass http://$backend:80$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Serving the plain shell beats serving nothing: React boots and
        # fetches its own data, so a backend that is down costs the metadata
        # for that request, not the page. 404s are deliberately not listed -
        # Laravel answers those with a shell of its own and the right status.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @shell;

        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location @shell {
        try_files /index.html =404;
    }
}
