services:
  mysql:
    image: mysql:8.0
    container_name: pubquiz-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    # Named explicitly so the scheduler can reuse this exact image. Without it
    # the tag depends on the directory name, and Compose treats it as something
    # to pull from a registry rather than something it just built.
    image: pubquiz-backend
    container_name: pubquiz-backend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./pub-quiz-api/.env.prod:/var/www/html/.env:ro
      - storage_data:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
      args:
        VITE_API_BASE_URL: https://koznazna.me/api
    container_name: pubquiz-frontend
    restart: always
    ports:
      - "5173:80"

  scheduler:
    # Same image as the backend, built by that service above. pull_policy stops
    # Compose reaching for a registry on a machine where it has not been built
    # yet, which is what breaks a first deploy on a fresh server.
    image: pubquiz-backend
    pull_policy: never
    container_name: pubquiz-scheduler
    restart: always
    command: >
      bash -c "while true; do
        php artisan schedule:run --no-interaction >> /var/log/scheduler.log 2>&1;
        sleep 60;
      done"
    volumes:
      - ./pub-quiz-api/.env.prod:/var/www/html/.env:ro
      - storage_data:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  mysql_data:
  storage_data:
